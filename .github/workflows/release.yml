name: Moonlight WorkBuddy Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: moonlight-workbuddy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed NonRoot release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-37' \
            'build-tools;37.0.0' \
            'ndk;29.0.14206865'

      - name: Resolve and verify version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)"
          if [[ -z "$version" ]]; then
            echo 'Unable to read versionName from app/build.gradle' >&2
            exit 1
          fi
          release_tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" != "$release_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match $release_tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moonlight-workbuddy-release.p12"
          chmod 600 "$RUNNER_TEMP/moonlight-workbuddy-release.p12"

      - name: Test and build signed APK
        shell: bash
        env:
          CI: 'true'
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/moonlight-workbuddy-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testNonRootDebugUnitTest assembleNonRootRelease --no-daemon --stacktrace

      - name: Verify and stage signed APK
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tools = Join-Path $env:ANDROID_SDK_ROOT 'build-tools/37.0.0'
          ./scripts/ci/verify-release.ps1 `
            -ApkPath app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk `
            -Aapt2 (Join-Path $tools 'aapt2') `
            -Zipalign (Join-Path $tools 'zipalign') `
            -Apksigner (Join-Path $tools 'apksigner')
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk `
            "dist/Moonlight-WorkBuddy-$env:RELEASE_VERSION.apk"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v7
        with:
          name: moonlight-workbuddy-release
          path: dist/Moonlight-WorkBuddy-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: moonlight-workbuddy-release
          path: dist

      - name: Create checksum
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Moonlight WorkBuddy ${GITHUB_REF_NAME#v}" \
            --generate-notes
