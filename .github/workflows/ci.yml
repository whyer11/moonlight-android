name: Moonlight WorkBuddy CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: moonlight-workbuddy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: NonRoot tests and Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'ndk;29.0.14206865'

      - name: Run tests and build Debug APK
        shell: bash
        run: ./gradlew testNonRootDebugUnitTest assembleNonRootDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Moonlight-WorkBuddy-debug-apk
          path: app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk
          if-no-files-found: error
          retention-days: 7
