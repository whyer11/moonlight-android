apply plugin: 'com.android.application'

def releaseSigning = [
        storeFile: System.getenv('ANDROID_KEYSTORE_FILE'),
        storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
        keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
        keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def releaseSigningPresent = releaseSigning.values().any { it != null && !it.trim().isEmpty() }
def releaseSigningComplete = releaseSigning.values().every { it != null && !it.trim().isEmpty() }
def ciReleaseTaskRequested = System.getenv('CI') == 'true' &&
        gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

if ((releaseSigningPresent && !releaseSigningComplete) || (ciReleaseTaskRequested && !releaseSigningComplete)) {
    throw new GradleException('Release signing environment is incomplete')
}

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 36

        versionName "12.2-workbuddy.1"
        versionCode = 315001

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.limelight.workbuddy.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "com.limelight.workbuddy"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    if (releaseSigningComplete) {
        signingConfigs {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
                storeType 'PKCS12'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Moonlight WorkBuddy (Debug)"
            resValue "string", "app_label_root", "Moonlight WorkBuddy Root (Debug)"
        }
        release {
            resValue "string", "app_label", "Moonlight WorkBuddy"
            resValue "string", "app_label_root", "Moonlight WorkBuddy Root"

            if (releaseSigningComplete) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
